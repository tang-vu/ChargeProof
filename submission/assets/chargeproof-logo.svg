<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-labelledby="title description">
  <title id="title">ChargeProof logo</title>
  <desc id="description">Three angled energy bars above the ChargeProof wordmark on a deep navy technical grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c151e"/>
      <stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(240 184) rotate(90) scale(196)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#42e9f5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#42e9f5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#42e9f5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="480" height="480" rx="56" fill="url(#background)"/>
  <rect width="480" height="480" rx="56" fill="url(#grid)"/>
  <rect width="480" height="480" rx="56" fill="url(#glow)"/>
  <rect x="16" y="16" width="448" height="448" rx="42" fill="none" stroke="#28414d" stroke-width="2"/>

  <g transform="translate(141 90) skewX(-11)" filter="url(#cyanGlow)">
    <rect width="198" height="46" rx="8" fill="#42e9f5"/>
    <rect x="30" y="62" width="138" height="46" rx="8" fill="#c8ff45"/>
    <rect y="124" width="198" height="46" rx="8" fill="#42e9f5"/>
  </g>

  <path d="M88 292H392" stroke="#1a2a34" stroke-width="2"/>
  <circle cx="88" cy="292" r="4" fill="#c8ff45"/>
  <circle cx="392" cy="292" r="4" fill="#42e9f5"/>

  <text x="240" y="354" fill="#ecf7f5" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="40" font-weight="700" letter-spacing="4">CHARGE<tspan fill="#42e9f5">PROOF</tspan></text>
  <text x="240" y="392" fill="#82949a" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="2.4">VERIFIED ENERGY SETTLEMENT</text>
</svg>
